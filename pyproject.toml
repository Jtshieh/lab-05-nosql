[project]
name = "nosql-lab"
version = "0.1.0"
description = "NoSQL work for DS2022"
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.19.0",
]

[project.scripts]
nosql-lab = "nosql_lab.bookstore_report:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
